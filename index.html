<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 명언 큐레이터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e1b4b;
            --bg-gradient-3: #311042;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-purple: #c084fc;
            --accent-blue: #60a5fa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            margin-top: 1rem;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(192, 132, 252, 0.15);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 50px;
            color: var(--accent-purple);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 3rem;
            width: 100%;
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        .tag-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tag-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
        }

        .tag-btn.active {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.3), rgba(96, 165, 250, 0.3));
            border-color: var(--accent-purple);
            color: #ffffff;
            font-weight: 600;
        }

        .generate-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 1.1rem 2.8rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(168, 85, 247, 0.6);
        }

        .quotes-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .quote-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }

        .quote-card:hover {
            border-color: rgba(192, 132, 252, 0.4);
            transform: translateY(-4px);
        }

        .emoji-box {
            font-size: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            min-height: 65px;
        }

        .quote-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .quote-text {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.2rem;
            line-height: 1.7;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .quote-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quote-author {
            font-size: 0.95rem;
            color: var(--accent-purple);
            font-weight: 600;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        footer {
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="badge">✨ AI Curation Engine</div>
            <h1>오늘의 맞춤 명언 큐레이터</h1>
            <p class="subtitle">버튼을 누르면 알고리즘이 맞춤 명언과 이모지를 추천합니다.</p>
        </header>

        <section class="controls">
            <div class="category-tags">
                <button class="tag-btn active" data-category="all">🔮 전체 추천</button>
                <button class="tag-btn" data-category="success">🚀 성공 & 성장</button>
                <button class="tag-btn" data-category="mind">🌿 마음 평정</button>
                <button class="tag-btn" data-category="courage">🔥 용기 & 도전</button>
                <button class="tag-btn" data-category="wisdom">💡 삶의 지혜</button>
            </div>

            <button id="generateBtn" class="generate-btn">
                <span>✨ 오늘의 명언 추천받기</span>
            </button>
        </section>

        <main id="quotesContainer" class="quotes-grid"></main>
    </div>

    <footer>
        <p>© Daily Quotes Curator. All rights reserved.</p>
    </footer>

    <script>
        const quoteDatabase = [
            { text: "위대한 일을 하는 유일한 방법은 당신이 하는 일을 사랑하는 것입니다.", author: "스티브 잡스", category: "success", emoji: "🍎" },
            { text: "성공은 매일 반복되는 작은 노력들의 합이다.", author: "로버트 콜리어", category: "success", emoji: "🌱" },
            { text: "평화는 미소에서 시작됩니다.", author: "마더 테레사", category: "mind", emoji: "🕊️" },
            { text: "폭풍 속에서도 마음의 안식처를 찾는 법을 배워야 한다.", author: "마르쿠스 아우렐리우스", category: "mind", emoji: "⚓" },
            { text: "두려움 때문에 시도조차 하지 않는 것이 가장 큰 실패다.", author: "세네카", category: "courage", emoji: "🦁" },
            { text: "당신이 꿈꿀 수 있다면, 당신은 그것을 이룰 수 있습니다.", author: "월트 디즈니", category: "courage", emoji: "✨" },
            { text: "시간은 인간이 쓸 수 있는 가장 귀중한 자원이다.", author: "테오프라스토스", category: "wisdom", emoji: "⏳" },
            { text: "진정한 지혜는 내가 아무것도 모른다는 것을 아는 데 있다.", author: "소크라테스", category: "wisdom", emoji: "🦉" }
        ];

        let selectedCategory = 'all';

        const generateBtn = document.getElementById('generateBtn');
        const quotesContainer = document.getElementById('quotesContainer');
        const tagBtns = document.querySelectorAll('.tag-btn');

        tagBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tagBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.category;
                generateQuotes();
            });
        });

        function getRecommendation(category, count = 3) {
            let filtered = category === 'all' ? quoteDatabase : quoteDatabase.filter(q => q.category === category);
            const shuffled = [...filtered].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function generateQuotes() {
            quotesContainer.innerHTML = '';
            const selectedQuotes = getRecommendation(selectedCategory, 3);

            selectedQuotes.forEach((quote) => {
                const card = document.createElement('div');
                card.className = 'quote-card';
                card.innerHTML = `
                    <div class="emoji-box">${quote.emoji}</div>
                    <div class="quote-content">
                        <div class="quote-text">"${quote.text}"</div>
                        <div class="quote-footer">
                            <div class="quote-author">— ${quote.author}</div>
                            <button class="action-btn" onclick="copyQuote('${quote.text}', '${quote.author}')">📋 복사</button>
                        </div>
                    </div>
                `;
                quotesContainer.appendChild(card);
            });
        }

        function copyQuote(text, author) {
            navigator.clipboard.writeText(`"${text}" - ${author}`);
            alert('클립보드에 복사되었습니다!');
        }

        generateBtn.addEventListener('click', generateQuotes);
        window.addEventListener('DOMContentLoaded', generateQuotes);
    </script>
</body>
</html>
